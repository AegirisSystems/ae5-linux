[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegaudio"
version = "0.1.0"
description = "Independent Linux control panel for Creative CA0132 audio cards"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]
license = {text = "GPL-2.0-or-later"}

[project.scripts]
aegaudio = "aegaudio.ui:main"

[tool.setuptools]
packages = ["aegaudio"]
