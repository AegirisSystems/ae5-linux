# AE-5 Direct output, active only under the managed service.
context.properties = { default.clock.rate = 384000 default.clock.allowed-rates = [ 384000 ] }
context.objects = [
 { factory = adapter args = {
  factory.name = api.alsa.pcm.sink
  node.name = "@SINK@"
  node.description = "Sound BlasterX AE-5 Direct"
  media.class = Audio/Sink
  priority.driver = 3000
  api.alsa.path = "hw:@CARD@,0"
  api.alsa.period-size = 4096
  api.alsa.period-num = 8
  api.alsa.soft-mixer = true
  audio.format = S32
  audio.rate = 384000
  audio.allowed-rates = [ 384000 ]
  audio.channels = 2
  audio.position = [ FL FR ]
  resample.disable = true
  session.suspend-timeout-seconds = 0
  adapter.auto-port-config = { mode = dsp monitor = true control = false position = preserve }
 } }
]
